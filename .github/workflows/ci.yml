name: Legacy Python Matrix

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  legacy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python_version: [ "2.2", "2.3", "2.4" ]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Try pulling existing image
        id: pull
        continue-on-error: true
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/legacy-python:${{ matrix.python_version }}

      - name: Build image if pull failed
        if: steps.pull.outcome == 'failure'
        run: |
          docker build \
            --build-arg PYVER=${{ matrix.python_version }} \
            -t ghcr.io/${{ github.repository_owner }}/legacy-python:${{ matrix.python_version }} .

      - name: Push image if newly built
        if: steps.pull.outcome == 'failure'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/legacy-python:${{ matrix.python_version }}

      - name: Run rorpy
        run: |
          docker run \
            -v $PWD:/app \
            ghcr.io/${{ github.repository_owner }}/legacy-python:${{ matrix.python_version }} \
            python rorpy.py --cr tests/testcr.cr
